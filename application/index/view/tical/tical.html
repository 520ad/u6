<div id="content-container" class="container">
    <div class="row">
        <div class="col-md-3">
            {include file="common/sidenav" /}
        </div>
        <div class="col-md-9">
            <div class="panel panel-default panel-recharge">
                <div class="panel-body">
                    <h2 class="page-header">{:__('提卡明细')} - 账户余额：{$user.money}</h2>
                    <div class="alert alert-info-light">
                        提取到卡密后您可以到任何渠道进行销售<br>
                        客户购买卡密后到客户端---兑换会员---卡密兑换、届时将获得对应的会员时间<br>
                    </div>
                    <div class="clearfix"></div>
                    <form action="{:url('tical/index')}" method="post">
                        <input name="id" type="hidden" value="{$user_group.id}">
                        <h3>套餐名称：{$user_group.name} (单价{$unit_price}元)</h3>
                        <div class="row">
                            <div class="col-xs-6 col-sm-4 col-md-3 col-lg-4">
                                <label>
                                    <input name="num" type="text" class="form-control" placeholder="卡密数量">
                                </label>
                            </div>
                        </div>
                        <div class="row row-recharge" style="margin:20px -15px 0 -15px;">
                            <div class="col-xs-6 col-sm-4 col-md-4 col-lg-2">
                                <input type="submit" class="btn btn-success btn-recharge btn-block" value="{:__('立即提卡')}" />
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
